<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="受共享密码保护的私人行程">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>私人行程 · 需要解锁</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="gate.css?v=20260829g2">
</head>
<body class="gate-locked">
  <main class="gate-card" aria-labelledby="gateTitle">
    <div class="gate-mark" aria-hidden="true">🔐</div>
    <p class="gate-kicker">PRIVATE ITINERARY</p>
    <h1 id="gateTitle">私人行程</h1>
    <p class="gate-description">请输入同行成员共享的临时密码。密码只用于当前页面的本地解密，不会发送或保存在此网站。</p>
    <form class="gate-form" id="gateForm">
      <label for="gatePassword">共享密码</label>
      <input id="gatePassword" name="password" type="password" minlength="16" maxlength="256" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
      <button id="gateSubmit" type="submit">解锁行程</button>
    </form>
    <p class="gate-status" id="gateStatus" role="status" aria-live="polite"></p>
    <p class="gate-footnote">刷新或关闭页面后需要重新输入密码。请不要通过公开渠道转发密码。</p>
    <noscript><p class="gate-status">此加密页面需要启用 JavaScript 才能解锁。</p></noscript>
  </main>
  <script src="unlock.js?v=20260829g2" defer></script>
</body>
</html>
