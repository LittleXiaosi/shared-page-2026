<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="2026 夏威夷自驾行程、每日路线与预约事项">
  <title>夏威夷自驾行程 · 2026</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="hawaii-trip.css?v=20261008publicr3">
</head>
<body>
  <a class="skip-link" href="#dayView">跳到每日行程</a>

  <header class="trip-hero">
    <div class="page-shell hero-inner">
      <div class="hero-copy">
        <p class="eyebrow">HAWAII · 2026</p>
        <h1 id="tripTitle">夏威夷自驾行程</h1>
        <p class="hero-route" id="tripRoute"></p>
      </div>
      <div class="hero-date">
        <span id="tripDates"></span>
        <b id="tripParty"></b>
      </div>
      <div class="trip-facts" aria-label="已采用的核心方案">
        <article><span>大岛住宿</span><b id="bigIslandStay"></b></article>
        <article><span>欧胡住宿</span><b id="oahuStay"></b></article>
        <article><span>用车方案</span><b id="vehiclePlan"></b></article>
        <article><span>关键航班</span><b id="keyFlights"></b></article>
      </div>
    </div>
  </header>

  <section class="page-shell task-hub" aria-labelledby="taskHubTitle">
    <div class="section-heading">
      <div>
        <p class="eyebrow">RESERVATIONS</p>
        <h2 id="taskHubTitle">预约完成情况</h2>
        <p>本次行程所有需要预约的项目均已完成预约；每日行程和完整表格已同步。</p>
      </div>
      <div class="task-kpis" id="taskKpis" aria-label="预约进度"></div>
    </div>
    <div class="urgent-task-list" id="urgentTaskList"></div>
    <button class="text-button" id="toggleAllTasks" type="button" hidden>查看全部预约</button>
    <details class="prep-disclosure">
      <summary><span>其他行前准备</span><b id="prepCount"></b></summary>
      <div class="prep-task-list" id="prepTaskList"></div>
    </details>
  </section>

  <nav class="day-nav-shell" aria-label="选择行程日期">
    <div class="page-shell day-nav" id="dayNav"></div>
  </nav>

  <main class="page-shell day-focus" id="dayView" tabindex="-1"></main>

  <section class="page-shell support-zone" aria-label="辅助资料">
    <details class="support-disclosure" id="workbookDetails">
      <summary>
        <span><b>完整预约与行前准备表</b><small id="workbookSummary"></small></span>
        <span class="summary-action">展开管理</span>
      </summary>
      <div class="support-body">
        <div class="workbook-toolbar" aria-label="预约表筛选">
          <input id="workbookSearch" type="search" placeholder="搜索项目、负责人、名单或核对要点">
          <select id="workbookOwnerFilter" aria-label="按负责人筛选"><option value="">全部负责人</option></select>
          <select id="workbookCategoryFilter" aria-label="按分类筛选"><option value="">全部分类</option></select>
          <select id="workbookPriorityFilter" aria-label="按优先级筛选"><option value="">全部优先级</option></select>
          <label><input id="workbookPendingOnly" type="checkbox"> 只看未完成</label>
        </div>
        <div class="workbook-table-scroll">
          <table class="workbook-table" id="bookingWorkbookTable">
            <colgroup id="bookingWorkbookCols"></colgroup>
            <thead><tr id="bookingWorkbookHead"></tr></thead>
            <tbody id="bookingWorkbookBody"></tbody>
          </table>
        </div>
        <p class="table-count" id="workbookVisibleCount"></p>
      </div>
    </details>

    <details class="support-disclosure" id="budgetDetails">
      <summary>
        <span><b>预算汇总</b><small>默认折算口径与项目总额</small></span>
        <span class="summary-action">展开查看</span>
      </summary>
      <div class="support-body">
        <div class="budget-scroll">
          <table class="budget-table">
            <thead><tr><th>项目</th><th>金额</th><th>折合 CNY</th><th>说明</th></tr></thead>
            <tbody id="budgetRows"></tbody>
          </table>
        </div>
        <p class="support-note">全程共5人；每日卡片为单人粗略预算，实际以订单和现场消费为准。</p>
      </div>
    </details>
  </section>

  <footer class="site-footer">
    <div class="page-shell">
      <p>地图为高清路线截图，出发时请以实时导航、现场标牌和预约确认邮件为准。</p>
    </div>
  </footer>

  <script src="booking-table-data.js?v=20261008publicr3"></script>
  <script src="trip-data.js?v=20261008publicr3"></script>
  <script src="hawaii-trip.js?v=20261008publicr3"></script>
</body>
</html>
